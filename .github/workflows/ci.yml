name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_pdf_assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_pdf_assistant
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-real-use-000000000
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-real-0000
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: ai-pdf-documents
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # GH Actions' `services:` block can't override a container's command,
      # and minio's image needs `server /data` to actually start (its bare
      # entrypoint doesn't serve anything, so the services-block version
      # never passes its healthcheck) — run it by hand instead.
      - name: Start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api exec prisma migrate deploy

      - run: pnpm typecheck

      - run: pnpm --filter api test

      - run: pnpm build
