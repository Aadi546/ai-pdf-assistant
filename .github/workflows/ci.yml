name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_pdf_assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        # minio's default entrypoint needs a command; GH Actions services
        # can't override CMD, so this only works if the image's default
        # entrypoint accepts no args as "serve /data" — if this job fails
        # on the minio health check, switch it to a docker run step instead.

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_pdf_assistant
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-real-use-000000000
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-real-0000
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: ai-pdf-documents
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api exec prisma migrate deploy

      - run: pnpm typecheck

      - run: pnpm --filter api test

      - run: pnpm build
